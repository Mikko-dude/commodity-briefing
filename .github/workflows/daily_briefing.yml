name: Daily Executive Commodity Briefing

on:
  schedule:
    # Runs every Monday through Friday at 05:00 AM UTC (e.g., 07:00 AM Europe/Helsinki EEST)
    - cron: '17 5 * * 1-6'
  workflow_dispatch: # Allows you to manually trigger the script anytime from the GitHub "Actions" tab

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Commodity Briefing Crew
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
